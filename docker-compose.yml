services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: morfosis
      POSTGRES_USER: morfosis
      POSTGRES_PASSWORD: morfosis_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morfosis -d morfosis"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: morfosis
      DB_PASSWORD: morfosis_dev
      DB_NAME: morfosis
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://morfosis:morfosis_dev@pgbouncer:5432/morfosis?sslmode=disable
      NATS_URL: nats://nats:4222
      VALKEY_URL: redis://valkey:6379/0
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      pgbouncer:
        condition: service_started
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  postgres_data:
  nats_data:
